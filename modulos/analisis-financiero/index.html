<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Finora: análisis vertical y horizontal de todas las cuentas, indicadores, gráficas, interpretación, recomendaciones y comprobaciones.">
  <title>Análisis financiero · Finora</title>
  <script src="../../assets/js/presentation.js"></script>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/casos.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../../assets/css/motion.css">
  <link rel="stylesheet" href="../../assets/css/presentation.css">
  <script defer src="../../assets/js/finance.js"></script>
  <script defer src="../../assets/js/casos.js"></script>
  <script defer src="../../assets/js/app.js"></script>
  <script defer src="../../assets/js/case-bar.js"></script>
  <script defer src="./script.js"></script>
  <script defer src="../../assets/js/motion.js"></script>
</head>
<body data-page="analisis-financiero" data-base="../../">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="sidebar-overlay" data-close-menu></div>
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
  <div class="workspace">
    <header class="topbar" id="topbar"></header>
    <main class="main-content" id="main">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Entiende tus resultados</p>
          <h1 class="page-title">Análisis financiero</h1>
          <p class="page-description">Análisis vertical y horizontal de todas las cuentas, con indicadores, gráficas, interpretación y recomendaciones.</p>
        </div>
        <div class="heading-actions">
          <a class="button button-secondary" href="../estados-financieros/index.html"><i data-icon="file"></i>Editar cuentas</a>
          <button class="button button-primary" type="button" id="print-analysis"><i data-icon="download"></i>Imprimir / PDF</button>
        </div>
      </div>

      <section class="panel case-bar" id="case-bar" aria-label="Empresa"></section>

      <section class="stats-grid" id="analysis-stats" aria-label="Indicadores destacados"></section>

      <div class="analysis-tabs" role="tablist" aria-label="Partes del análisis">
        <button class="tab-button" type="button" role="tab" id="tab-balance" aria-controls="panel-balance" data-tab="balance">Balance general</button>
        <button class="tab-button" type="button" role="tab" id="tab-income" aria-controls="panel-income" data-tab="income">Estado de resultados</button>
        <button class="tab-button" type="button" role="tab" id="tab-charts" aria-controls="panel-charts" data-tab="charts">Gráficas e indicadores</button>
        <button class="tab-button" type="button" role="tab" id="tab-reading" aria-controls="panel-reading" data-tab="reading">Interpretación</button>
        <button class="tab-button" type="button" role="tab" id="tab-advice" aria-controls="panel-advice" data-tab="advice">Recomendaciones</button>
        <button class="tab-button" type="button" role="tab" id="tab-ratios" aria-controls="panel-ratios" data-tab="ratios">Razones y DuPont</button>
        <button class="tab-button" type="button" role="tab" id="tab-checks" aria-controls="panel-checks" data-tab="checks">Comprobaciones</button>
      </div>

      <section id="panel-balance" role="tabpanel" aria-labelledby="tab-balance"></section>
      <section id="panel-income" role="tabpanel" aria-labelledby="tab-income" hidden></section>
      <section id="panel-charts" role="tabpanel" aria-labelledby="tab-charts" hidden></section>
      <section id="panel-reading" role="tabpanel" aria-labelledby="tab-reading" hidden></section>
      <section id="panel-advice" role="tabpanel" aria-labelledby="tab-advice" hidden></section>
      <section id="panel-ratios" role="tabpanel" aria-labelledby="tab-ratios" hidden></section>
      <section id="panel-checks" role="tabpanel" aria-labelledby="tab-checks" hidden></section>
    </main>
    <footer class="page-footer"><span>Finora · Sistema de Análisis y Planeación Financiera</span><span>Etapa 02 · Datos conectados</span></footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
